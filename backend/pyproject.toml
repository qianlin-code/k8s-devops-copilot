[project]
name = "enterprise-support-copilot"
version = "1.0.0"
description = "Enterprise IT support Copilot with RAG + Agent closed loop"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "sqlalchemy==2.0.36",
    "openai==1.59.6",
    "qdrant-client==1.12.2",
    "rank-bm25==0.2.2",
    "tenacity==9.0.0",
    "python-multipart==0.0.20",
    "bcrypt==5.0.0",
    "PyJWT==2.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "httpx==0.28.1",
]
# Rerank 会拉入 torch（约 2.5 GB），单独成组：
# 契约测试用替身 reranker，不装也能跑；缺失时检索链路自动降级为融合顺序。
# GPU 版需先装对应 CUDA 的 torch:
#   uv pip install torch --index-url https://download.pytorch.org/whl/cu124
rerank = [
    "FlagEmbedding==1.3.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# 让 app/ 与 tests/ 可直接导入，无需可编辑安装。
# 可编辑安装会写入含中文路径的 .pth，Python 3.11 在 GBK 环境下解码会失败。
pythonpath = ["."]
