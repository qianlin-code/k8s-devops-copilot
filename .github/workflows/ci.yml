name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-offline:
    name: Backend offline tests (Python 3.11)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # 不使用 uv sync：它会把当前项目 editable 安装到 .venv；Windows 中文路径
      # 下该 .pth 可能被 GBK 读取而失效。测试通过 pytest 的 pythonpath 直接导入 app/。
      - run: uv venv --python 3.11 .venv
      - run: uv export --frozen --extra dev --no-emit-project > "$RUNNER_TEMP/backend-requirements.txt"
      - run: uv pip install --python .venv/bin/python -r "$RUNNER_TEMP/backend-requirements.txt"
      - run: .venv/bin/python -m pytest tests -q

  frontend-build:
    name: Frontend typecheck and build (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
